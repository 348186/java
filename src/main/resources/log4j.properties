# 指导书「步骤 2.5 集成 Log4j 日志」：log4j.properties 位于 classpath 根目录
log4j.rootLogger=DEBUG, console

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%p] %c - %m%n

# 只开本工程的 SQL 日志，避免第三方依赖刷屏
log4j.logger.com.lab.mapper=DEBUG
log4j.logger.com.lab.cache=DEBUG
log4j.logger.org.apache.ibatis=INFO
log4j.logger.com.mysql=WARN
log4j.logger.com.alibaba=WARN
